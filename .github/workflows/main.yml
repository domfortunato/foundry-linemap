name: Release Creation

on:
  # A version tag (vX.Y.Z) builds and publishes the release with module.json + module.zip.
  # The tag is made on the Gitea side by `npm run release X.Y.Z` and reaches GitHub through the
  # push mirror, which would delete a tag made on GitHub itself. So there is deliberately no
  # `release: [published]` trigger: a release made in GitHub's UI makes a GitHub-only tag, and
  # building it would only hide that the next mirror sync is about to prune it.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Rebuild and re-attach the assets of an existing tag, from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v0.14.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The tag's own commit on both triggers, with history, so the annotated tag's body is readable.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Fetch the tag object (checkout can leave an annotated tag lightweight)
        run: git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # A manual rebuild only re-attaches files to a release that already exists. Without this, a
      # dispatch on any tag (upstream's v0.12.0, say) would create a release and could take "latest".
      - name: On a rebuild, the release must already exist
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::no release exists for $RELEASE_TAG; a rebuild only refreshes an existing release (cut new ones with npm run release)"
            exit 1
          fi

      # "latest" moves only for a tag push of the highest version tag, never for a rebuild or an
      # older tag (GitHub would otherwise make the newest-created release latest). "Highest" counts
      # this fork's releases and this tag only: the repo also carries upstream's tags (v0.12.0,
      # v0.13.0), and a higher one of theirs would have kept every release here from being latest.
      - name: Whether this release becomes latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          released=$(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName')
          highest=$(printf '%s\n' $released "$RELEASE_TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "${{ github.event_name }}" = "push" ] && [ "$RELEASE_TAG" = "$highest" ]; then
            echo "MAKE_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "MAKE_LATEST=false" >> "$GITHUB_ENV"
          fi
          echo "highest tag: $highest; this run: $RELEASE_TAG (${{ github.event_name }})"

      - run: npm ci
      - run: npm run build

      # Every file the manifest names must be in the build, or the release would install broken.
      - name: Check the build has every file module.json names
        run: |
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("dist/module.json", "utf8"));
            const paths = [...(m.esmodules ?? []), ...(m.scripts ?? []), ...(m.styles ?? []), ...(m.languages ?? []).map(l => l.path)];
            const missing = paths.filter(p => !fs.existsSync(`dist/${p}`));
            if (missing.length) { console.error(`::error::missing from dist/: ${missing.join(", ")}`); process.exit(1); }
            console.log(`dist/ has all ${paths.length} files module.json names`);
          '

      - name: Versioned manifest in the build
        env:
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.RELEASE_TAG, version = tag.replace(/^v/, "");
            const m = JSON.parse(fs.readFileSync("dist/module.json", "utf8"));
            if (m.version !== version) {
              console.error(`::error::module.json says ${m.version} but the tag is ${tag}; release with npm run release`);
              process.exit(1);
            }
            m.manifest = `https://github.com/${process.env.REPO}/releases/latest/download/module.json`;
            m.download = `https://github.com/${process.env.REPO}/releases/download/${tag}/module.zip`;
            fs.writeFileSync("dist/module.json", JSON.stringify(m, null, 4) + "\n");
            console.log(`module.json: version ${m.version}, download ${m.download}`);
          '
          cp dist/module.json ./module.json

      - name: Zip the build
        run: cd dist && zip -r ../module.zip . && cd .. && unzip -l module.zip | tail -1

      - name: Read the release notes from the tag
        run: |
          git tag -l --format='%(contents:body)' "$RELEASE_TAG" > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "release notes: $(wc -l < release-notes.md) lines from tag $RELEASE_TAG"
          else
            echo "::warning::tag $RELEASE_TAG carries no notes"
          fi

      - name: Publish the release with its files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitNameDuringUpdate: true
          bodyFile: release-notes.md
          # A rebuild keeps the release's notes; a re-pushed tag (a redo) brings corrected ones.
          omitBodyDuringUpdate: ${{ github.event_name == 'workflow_dispatch' }}
          makeLatest: ${{ env.MAKE_LATEST }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./module.json, ./module.zip"
          tag: ${{ env.RELEASE_TAG }}

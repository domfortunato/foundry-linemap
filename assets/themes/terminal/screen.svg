<?xml version="1.0" encoding="UTF-8"?>
<!-- A dark terminal screen for the Terminal theme, written for this module: near-black with a green
     cast, faint scanlines and a soft vignette. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2048px" height="2048px" viewBox="0 0 2048 2048">
<defs>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.75">
<stop offset="0" stop-color="#0b1f10"/>
<stop offset="0.6" stop-color="#06120a"/>
<stop offset="1" stop-color="#020604"/>
</radialGradient>
<pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="8" height="3" fill="#1d4a28" fill-opacity="0.18"/>
</pattern>
</defs>
<rect width="2048" height="2048" fill="url(#glow)"/>
<rect width="2048" height="2048" fill="url(#scan)"/>
</svg>

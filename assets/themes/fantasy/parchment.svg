<?xml version="1.0" encoding="UTF-8"?>
<!-- A parchment for the fantasy theme, written for this module. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2048px" height="2048px" viewBox="0 0 2048 2048">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="4" seed="11" result="clouds"/>
<feColorMatrix in="clouds" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.16  0 0 0 0.55 -0.12" result="stains"/>
<feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="5" result="fine"/>
<feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.18 0" result="fibres"/>
<feMerge><feMergeNode in="stains"/><feMergeNode in="fibres"/></feMerge>
</filter>
<radialGradient id="edge" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#7a5a30" stop-opacity="0"/><stop offset="1" stop-color="#7a5a30" stop-opacity="0.22"/></radialGradient>
</defs>
<rect width="2048" height="2048" fill="#efe0bb"/>
<rect width="2048" height="2048" filter="url(#grain)"/>
<rect width="2048" height="2048" fill="url(#edge)"/>
</svg>
